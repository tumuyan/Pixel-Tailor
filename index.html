<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel-Tailor - 图片裁缝</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <h1 class="title">Pixel-Tailor</h1>
            <p class="subtitle">图片裁缝 - 智能图片分割工具</p>
            <div class="language-switch">
                <button id="lang-zh" class="lang-btn active">中文</button>
                <button id="lang-en" class="lang-btn">English</button>
            </div>
        </header>

        <main class="main-content">
            <!-- 输入区域 -->
            <section class="input-section">
                <div class="input-controls">
                    <label for="image-input" class="input-label">
                        <span data-i18n="select-images">选择图片</span>
                        <input type="file" id="image-input" accept="image/*" multiple>
                    </label>
                    <div class="split-direction">
                        <label data-i18n="split-direction">分割方向：</label>
                        <label class="radio-label">
                            <input type="radio" name="direction" value="horizontal">
                            <span data-i18n="horizontal">横向</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="direction" value="vertical" checked>
                            <span data-i18n="vertical">竖向</span>
                        </label>
                    </div>
                    <div class="split-mode">
                        <label data-i18n="split-mode">分割模式：</label>
                        <label class="radio-label">
                            <input type="radio" name="mode" value="auto" checked>
                            <span data-i18n="auto">自动</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="mode" value="manual">
                            <span data-i18n="manual">手动</span>
                        </label>
                    </div>
                </div>
            </section>

            <!-- 手动分割控制 -->
            <section class="manual-controls" id="manual-controls" style="display: none;">
                <div class="manual-tips">
                    <p><strong>操作提示：</strong></p>
                    <ul>
                        <li>使用右上角工具栏切换操作模式</li>
                        <li><strong>移动画布模式：</strong>拖拽分割线调整位置，右键删除</li>
                        <li><strong>添加分割线模式：</strong>点击图片添加分割线</li>
                        <li><strong>移除分割线模式：</strong>直接点击分割线删除</li>
                        <li><strong>挑选模式：</strong>点击图片区域选择要导出的部分</li>
                    </ul>
                </div>
                <div class="equal-split">
                    <label data-i18n="equal-split">等分数量：</label>
                    <input type="number" id="split-count" min="2" max="20" value="2">
                    <button id="apply-split" data-i18n="apply">应用</button>
                </div>
                <div class="per-image-controls" id="per-image-controls" style="display: none;">
                    <h3 data-i18n="per-image-settings">每张图片设置：</h3>
                    <div id="image-split-list"></div>
                </div>
            </section>

            <!-- 图片预览和分割区域 -->
            <section class="preview-section">
                <!-- 悬浮工具栏 -->
                <div class="floating-toolbar" id="floating-toolbar">
                    <div class="toolbar-title" data-i18n="toolbar-title">工具模式</div>
                    <div class="toolbar-buttons">
                        <button class="toolbar-btn active" data-mode="move" data-i18n="move-canvas">移动画布</button>
                        <button class="toolbar-btn" data-mode="add-split" data-i18n="add-split">添加分割线</button>
                        <button class="toolbar-btn" data-mode="remove-split" data-i18n="remove-split">移除分割线</button>
                        <button class="toolbar-btn" data-mode="select" data-i18n="select-parts">挑选</button>
                    </div>
                </div>
                
                <div class="canvas-container">
                    <canvas id="main-canvas"></canvas>
                    <div class="split-lines" id="split-lines"></div>
                    <div class="part-overlays" id="part-overlays"></div>
                </div>
                <div class="part-selector-container" id="part-selector-container" style="display: none;">
                    <h4 data-i18n="click-to-select">挑选需要导出的部分：</h4>
                    <div class="part-selectors" id="part-selectors"></div>
                </div>
                <div class="zoom-controls">
                    <button id="zoom-out" data-i18n="zoom-out">缩小</button>
                    <span id="zoom-level">100%</span>
                    <button id="zoom-in" data-i18n="zoom-in">放大</button>
                    <button id="zoom-fit" data-i18n="fit-screen">适应屏幕</button>
                </div>
            </section>

            <!-- 选择和导出区域 -->
            <section class="export-section">
                <div class="selection-info">
                    <h3 data-i18n="select-parts">选择要导出的部分：</h3>
                    <div class="selection-controls">
                        <button id="select-all" data-i18n="select-all">全选</button>
                        <button id="deselect-all" data-i18n="deselect-all">取消全选</button>
                        <button id="invert-selection" data-i18n="invert">反选</button>
                    </div>
                    <div class="selected-count">
                        <span data-i18n="selected">已选择：</span>
                        <span id="selected-count">0</span>
                        <span data-i18n="parts">部分</span>
                    </div>
                </div>
                
                <div class="export-controls">
                    <div class="export-mode">
                        <label data-i18n="export-mode">导出模式：</label>
                        <label class="radio-label">
                            <input type="radio" name="export-mode" value="merged" checked>
                            <span data-i18n="merged">合并为一张图片</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="export-mode" value="separate">
                            <span data-i18n="separate">导出为独立图片</span>
                        </label>
                    </div>
                    
                    <div class="export-format">
                        <label data-i18n="format">格式：</label>
                        <select id="format-select">
                            <option value="png">PNG</option>
                            <option value="jpeg">JPEG</option>
                            <option value="webp">WebP</option>
                        </select>
                    </div>
                    
                    <button id="export-btn" class="export-btn" data-i18n="export">导出</button>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
