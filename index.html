<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Splitter</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="header-content">
        <h1 class="app-title">Image Splitter</h1>
        <button class="lang-toggle" id="langToggle" aria-label="Toggle language">
          <span id="langLabel">中文</span>
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <div class="content-wrapper">
        <!-- Sidebar: Upload & Controls -->
        <aside class="sidebar">
          <section class="upload-section">
            <h2 id="uploadTitle">Upload Images</h2>
            
            <!-- Drag & Drop Area -->
            <div class="drop-zone" id="dropZone">
              <div class="drop-zone-content">
                <svg class="drop-zone-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                  <polyline points="17 8 12 3 7 8"></polyline>
                  <line x1="12" y1="3" x2="12" y2="15"></line>
                </svg>
                <p id="dropText">Drag images here or click</p>
              </div>
              <input
                type="file"
                id="fileInput"
                multiple
                accept="image/*"
                class="file-input"
              />
            </div>

            <!-- Split Direction Toggle -->
            <div class="control-section">
              <label id="splitLabel">Split Direction:</label>
              <div class="button-group">
                <button
                  class="direction-btn active"
                  data-direction="horizontal"
                  id="directionHorizontal"
                  aria-pressed="true"
                >
                  <span id="horizontalText">Horizontal</span>
                </button>
                <button
                  class="direction-btn"
                  data-direction="vertical"
                  id="directionVertical"
                  aria-pressed="false"
                >
                  <span id="verticalText">Vertical</span>
                </button>
              </div>
            </div>
          </section>

          <!-- Thumbnail List -->
          <section class="thumbnail-section">
            <h3 id="imagesTitle">Images</h3>
            <div class="thumbnail-list" id="thumbnailList">
              <!-- Thumbnails will be inserted here -->
            </div>
          </section>
        </aside>

        <!-- Main Canvas Area -->
        <section class="canvas-section">
          <div class="canvas-container">
            <canvas id="previewCanvas" class="preview-canvas"></canvas>
            <div class="canvas-placeholder" id="canvasPlaceholder">
              <p id="placeholderText">Select an image to preview</p>
            </div>
          </div>
          
          <!-- Zoom Controls -->
          <div class="zoom-controls">
            <button class="zoom-btn" id="zoomIn" aria-label="Zoom in">
              <span>+</span>
            </button>
            <span class="zoom-level" id="zoomLevel">100%</span>
            <button class="zoom-btn" id="zoomOut" aria-label="Zoom out">
              <span>−</span>
            </button>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/state.js"></script>
  <script src="assets/js/canvas.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
